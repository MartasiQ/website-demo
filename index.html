<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIF přes celou stránku</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    .fullscreen-gif {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Element img bez napevno zadaného src -->
  <img id="bg-gif" alt="Pozadí" class="fullscreen-gif">

  <script>
    // Seznam tvých GIFů
    const gify = ['nino.gif', 'nino2.gif'];

    // Náhodný výběr indexu (0 nebo 1)
    const nahodnyIndex = Math.floor(Math.random() * gify.length);

    // Nastavení zdroje obrázku
    document.getElementById('bg-gif').src = gify[nahodnyIndex];
  </script>

</body>
</html>
