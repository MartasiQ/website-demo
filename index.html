<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIF přes celou stránku</title>
  <style>
    /* Odstraní výchozí okraje a zabrání zobrazení posuvníků */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000; /* Černé pruhy po stranách/nahoře */
    }

    /* Roztáhne GIF na maximum se zachováním celého obrazu bez ořezu */
    .fullscreen-gif {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain; /* Zobrazí celý GIF bez ořezu se zachováním poměru stran */
      object-position: center; /* Vycentruje GIF na střed */
      z-index: 1;
    }
  </style>
</head>
<body>

  <img src="nino.gif" alt="Pozadí" class="fullscreen-gif">

</body>
</html>
