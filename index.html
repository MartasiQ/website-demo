<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">GIF přes celou stránku</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    .fullscreen-gif {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      z-index: 1;
    }
  </style>
</head>
<body>

  <img id="bg-gif" alt="Pozadí" class="fullscreen-gif">

  <script>
    // Seznam objektů s cestou k GIFu a odpovídajícím názvem stránky
    const gify = [
      { src: 'nino.gif', title: 'Bára' },
      { src: 'nino2.gif', title: 'Kačka' }
    ];

    // Náhodný výběr indexu (0 nebo 1)
    const nahodnyIndex = Math.floor(Math.random() * gify.length);

    // Nastavení obrázku a nadpisu karty v prohlížeči
    document.getElementById('bg-gif').src = gify[nahodnyIndex].src;
    document.title = gify[nahodnyIndex].title;
  </script>

</body>
</html>
</html>
